name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate workflow JSON and run rule tests
        run: node --test
      - name: Verify reproducible sample artifact
        run: |
          node scripts/generate-sample-run.mjs
          git diff --exit-code -- docs/sample-run.json
